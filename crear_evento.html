<div class="grid">
    <div class="item item-0">CREAR EVENTO</div>

    <div class="item item-1">
        <form id="formCrearEvento" class="form-crear-evento">
            <label for="nombre">Nombre del Evento:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ingrese el nombre del evento" required>

            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" name="fecha" required>

            <label for="hora">Hora de inicio:</label>
            <input type="time" id="hora" name="hora" required>

            <label for="hora-fin">Hora de finalización:</label>
            <input type="time" id="hora-fin" name="hora-fin" required>

            <label for="lugar">Lugar:</label>
            <input type="text" id="lugar" name="lugar" placeholder="Ingrese el lugar del evento" required>

            <label for="tipo">Tipo del evento:</label>
            <select id="tipo" name="tipo" required>
                <option value="" disabled selected>Seleccione un tipo de evento</option>
                <option value="concierto">Concierto</option>
                <option value="deporte">Deporte</option>
                <option value="teatro">Teatro</option>
                <option value="conferencia">Conferencia</option>
            </select>

            <button type="submit">Crear Evento</button>
        </form>
    </div>

    <div class="item item-2">
        <div class="preview-container">
            <h3 id="vista-previa">Vista previa de la imagen</h3>
            <img id="imgPreview" src="" alt="Vista previa de la imagen" style="display: none;">
            <!-- From Uiverse.io by SpatexDEV -->
            <button id="uploadBtn">
                <svg aria-hidden="true" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-width="2" stroke="#fffffff"
                        d="M13.5 3H12H8C6.34315 3 5 4.34315 5 6V18C5 19.6569 6.34315 21 8 21H11M13.5 3L19 8.625M13.5 3V7.625C13.5 8.17728 13.9477 8.625 14.5 8.625H19M19 8.625V11.8125"
                        stroke-linejoin="round" stroke-linecap="round"></path>
                    <path stroke-linejoin="round" stroke-linecap="round" stroke-width="2" stroke="#fffffff"
                        d="M17 15V18M17 21V18M17 18H14M17 18H20"></path>
                </svg>
                AGREGAR IMAGEN
            </button>
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
        </div>
    </div>
</div>
