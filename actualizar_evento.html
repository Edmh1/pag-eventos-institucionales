<div class="grid">
    <div class="item item-0">
        ACTUALIZAR EVENTO
        <div id="volver-div">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"
                fill="#2563eb"><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
                <path
                    d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288 416 288c17.7 0 32-14.3 32-32s-14.3-32-32-32l-306.7 0L214.6 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z" />
            </svg>
            <a id="volver-act" href="">Volver a la página principal</a>
        </div>
    </div>

    <div class="item item-1">
        <form id="formActualizarEvento" class="form-crear-evento">
            <label for="nombre-evento">Nombre del Evento:</label>
            <input type="text" id="nombre-evento" name="nombre-evento" placeholder="Ingrese el nombre del evento"
                required>

            <label for="lugar-evento">Lugar:</label>
            <input type="text" id="lugar-evento" name="lugar-evento" placeholder="Ingrese el lugar del evento" required>

            <button id="crear-evento">Guardar Cambios</button>
        </form>
    </div>

    <div class="item item-2">
        <div class="preview-container">
            <h3 id="vista-previa" style="display: none;">Vista previa de la imagen</h3>
            <img id="imgPreview" src="/resources/img/party.jpg" alt="Vista previa de la imagen">
            <!-- From Uiverse.io by SpatexDEV -->
            <button id="uploadBtn">
                <svg aria-hidden="true" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-width="2" stroke="#fffffff"
                        d="M13.5 3H12H8C6.34315 3 5 4.34315 5 6V18C5 19.6569 6.34315 21 8 21H11M13.5 3L19 8.625M13.5 3V7.625C13.5 8.17728 13.9477 8.625 14.5 8.625H19M19 8.625V11.8125"
                        stroke-linejoin="round" stroke-linecap="round"></path>
                    <path stroke-linejoin="round" stroke-linecap="round" stroke-width="2" stroke="#fffffff"
                        d="M17 15V18M17 21V18M17 18H14M17 18H20"></path>
                </svg>
                ACTUALIZAR IMAGEN
            </button>
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
        </div>
        <button id="eliminar-evento">Eliminar Evento</button>
    </div>
</div>
